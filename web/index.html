<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="《盲域》长篇小说阅读站，提供正文、世界观设定和档案查阅。">
  <title>盲域 · 阅读站</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要内容</a>
  <header class="site-header">
    <div class="site-header-inner frame">
      <a class="brand" href="#/" aria-label="盲域首页">
        <span class="brand-mark" aria-hidden="true"></span><span>盲域</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#/read" data-view="read">正文</a>
        <a href="#/settings" data-view="settings">设定集</a>
        <a href="#/archives" data-view="archives">档案室</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section class="frame initial-status" role="status">正在读取《盲域》…</section>
    <noscript><p class="frame">请开启浏览器的 JavaScript 以使用阅读站。</p></noscript>
  </main>
  <footer class="site-footer frame"><span>《盲域》</span><span class="site-footer-context">小说阅读站</span></footer>
  <aside class="term-popover" id="term-popover" aria-label="术语释义" hidden></aside>
  <dialog class="spoiler-dialog" id="spoiler-dialog" aria-labelledby="spoiler-title" aria-describedby="spoiler-description">
    <h2 id="spoiler-title">接下来可能剧透</h2>
    <p id="spoiler-description">确认后，本次查阅会显示阅读进度之外的档案、配图和设定。返回正文时会恢复按进度查看。</p>
    <div class="spoiler-actions">
      <button class="button quiet" type="button" data-cancel autofocus>取消</button>
      <button class="button primary" type="button" data-confirm>显示剧透内容</button>
    </div>
  </dialog>
</body>
</html>
