<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs><style>
.bg{fill:#111923}.node{fill:#1b3442;stroke:#71a8c5;stroke-width:3}.warn{fill:#40232a;stroke:#d76d74;stroke-width:3}.safe{fill:#243a31;stroke:#7fb38c;stroke-width:3}.txt{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#f4f1ea}.head{font-size:29px;font-weight:bold}.body{font-size:21px}.arrow{stroke:#d2dbe1;stroke-width:3;fill:none;marker-end:url(#a)}
</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d2dbe1"/></marker></defs>
<rect class="bg" width="1200" height="650"/><text class="txt head" x="600" y="55" text-anchor="middle">熵力：人类在盲域中的适应性变化</text>
<rect class="node" x="60" y="150" width="235" height="125" rx="18"/><text class="txt head" x="177" y="200" text-anchor="middle">进入盲域</text><text class="txt body" x="177" y="238" text-anchor="middle">极端处境 / 未知诱因</text>
<rect class="node" x="350" y="150" width="235" height="125" rx="18"/><text class="txt head" x="467" y="200" text-anchor="middle">生存压力</text><text class="txt body" x="467" y="238" text-anchor="middle">规则冲突 / 危机</text>
<rect class="node" x="640" y="150" width="235" height="125" rx="18"/><text class="txt head" x="757" y="200" text-anchor="middle">适应性变化</text><text class="txt body" x="757" y="238" text-anchor="middle">觉醒过程不完全可控</text>
<rect class="safe" x="930" y="150" width="220" height="125" rx="18"/><text class="txt head" x="1040" y="200" text-anchor="middle">独特熵力</text><text class="txt body" x="1040" y="238" text-anchor="middle">一人一套核心规则</text>
<path class="arrow" d="M295 212 H340"/><path class="arrow" d="M585 212 H630"/><path class="arrow" d="M875 212 H920"/>
<text class="txt head" x="600" y="365" text-anchor="middle">同一能力在不同环境中的代价不同</text>
<rect class="safe" x="170" y="415" width="370" height="145" rx="18"/><text class="txt head" x="355" y="465" text-anchor="middle">盲域内使用</text><text class="txt body" x="355" y="505" text-anchor="middle">不产生现实污染</text><text class="txt body" x="355" y="535" text-anchor="middle">仍可能消耗体力、注意力等</text>
<rect class="warn" x="660" y="415" width="370" height="145" rx="18"/><text class="txt head" x="845" y="465" text-anchor="middle">现实中使用</text><text class="txt body" x="845" y="505" text-anchor="middle">可能造成现实污染</text><text class="txt body" x="845" y="535" text-anchor="middle">局部异常 / 持续污染区域</text>
</svg>