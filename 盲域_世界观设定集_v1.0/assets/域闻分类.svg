<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><style>
.bg{fill:#111923}.card{fill:#1b2734;stroke:#7890a5;stroke-width:2}.txt{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#f3f0e9}.title{font-size:32px;font-weight:bold}.sub{font-size:21px;fill:#c2cbd3}.big{font-size:27px;font-weight:bold}
</style></defs>
<rect class="bg" width="1200" height="680"/><text class="txt title" x="600" y="58" text-anchor="middle">域闻：五种基础分类</text>
<rect class="card" x="55" y="115" width="340" height="190" rx="20"/><text class="txt big" x="225" y="165" text-anchor="middle">空间型</text><text class="txt sub" x="225" y="210" text-anchor="middle">空间、距离、方向、边界</text><text class="txt sub" x="225" y="250" text-anchor="middle">例：不存在的楼层</text>
<rect class="card" x="430" y="115" width="340" height="190" rx="20"/><text class="txt big" x="600" y="165" text-anchor="middle">实体型（域体）</text><text class="txt sub" x="600" y="210" text-anchor="middle">实体、生命特征、自主行为</text><text class="txt sub" x="600" y="250" text-anchor="middle">例：模仿人的影子</text>
<rect class="card" x="805" y="115" width="340" height="190" rx="20"/><text class="txt big" x="975" y="165" text-anchor="middle">物品型</text><text class="txt sub" x="975" y="210" text-anchor="middle">异常集中于物品</text><text class="txt sub" x="975" y="250" text-anchor="middle">例：显示未来的钟表</text>
<rect class="card" x="245" y="365" width="340" height="190" rx="20"/><text class="txt big" x="415" y="415" text-anchor="middle">信息型</text><text class="txt sub" x="415" y="460" text-anchor="middle">文字、声音、图像、记忆</text><text class="txt sub" x="415" y="500" text-anchor="middle">例：阅读后遗忘姓名</text>
<rect class="card" x="615" y="365" width="340" height="190" rx="20"/><text class="txt big" x="785" y="415" text-anchor="middle">事件型</text><text class="txt sub" x="785" y="460" text-anchor="middle">周期、流程、条件事件</text><text class="txt sub" x="785" y="500" text-anchor="middle">例：重复发生的车祸</text>
<text class="txt sub" x="600" y="625" text-anchor="middle">分类依据是主要表现；一个域闻可以同时具有多种类型特征。</text>
</svg>